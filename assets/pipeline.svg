<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="What the agent does with LeadGen.tools: find companies, decision makers, a unique email for each, send from your inbox, follow-ups, replies sorted by AI, then LinkedIn and WhatsApp">
  <title>The pipeline your agent runs with LeadGen.tools</title>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d9d9cf"/></pattern>
    <path id="rail" d="M80,118 H880"/>
  </defs>
  <rect width="960" height="330" fill="#f7f7f2"/>
  <rect width="960" height="330" fill="url(#dots)"/>

  <!-- rail -->
  <line x1="80" y1="118" x2="880" y2="118" stroke="#d6d6cf" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>
  <line x1="80" y1="118" x2="880" y2="118" stroke="#111" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" dur="10s" repeatCount="indefinite" values="100;0;0;100" keyTimes="0;0.7;0.96;1"/>
  </line>

  <!-- six steps -->
  <g font-size="13" text-anchor="middle">
    <g>
      <rect x="22" y="70" width="116" height="96" rx="14" fill="#fff" stroke="#111" stroke-width="2.5"><animate attributeName="fill" dur="10s" repeatCount="indefinite" values="#fff;#ecfccb;#ecfccb;#fff" keyTimes="0;0.04;0.96;1"/></rect>
      <text x="80" y="104" font-size="26">🗺️</text><text x="80" y="132" font-weight="700" fill="#111">Real companies</text><text x="80" y="150" fill="#5f6368" font-size="11.5">any niche · any city</text>
    </g>
    <g>
      <rect x="182" y="70" width="116" height="96" rx="14" fill="#fff" stroke="#111" stroke-width="2.5"><animate attributeName="fill" dur="10s" repeatCount="indefinite" values="#fff;#fff;#ecfccb;#ecfccb;#fff" keyTimes="0;0.13;0.17;0.96;1"/></rect>
      <text x="240" y="104" font-size="26">👤</text><text x="240" y="132" font-weight="700" fill="#111">Who decides</text><text x="240" y="150" fill="#5f6368" font-size="11.5">verified emails</text>
    </g>
    <g>
      <rect x="342" y="70" width="116" height="96" rx="14" fill="#fff" stroke="#111" stroke-width="2.5"><animate attributeName="fill" dur="10s" repeatCount="indefinite" values="#fff;#fff;#ecfccb;#ecfccb;#fff" keyTimes="0;0.26;0.30;0.96;1"/></rect>
      <text x="400" y="104" font-size="26">✍️</text><text x="400" y="132" font-weight="700" fill="#111">Unique emails</text><text x="400" y="150" fill="#5f6368" font-size="11.5">one per person</text>
    </g>
    <g>
      <rect x="502" y="70" width="116" height="96" rx="14" fill="#fff" stroke="#111" stroke-width="2.5"><animate attributeName="fill" dur="10s" repeatCount="indefinite" values="#fff;#fff;#ecfccb;#ecfccb;#fff" keyTimes="0;0.39;0.43;0.96;1"/></rect>
      <text x="560" y="104" font-size="26">📬</text><text x="560" y="132" font-weight="700" fill="#111">Your inbox</text><text x="560" y="150" fill="#5f6368" font-size="11.5">Gmail · SMTP</text>
    </g>
    <g>
      <rect x="662" y="70" width="116" height="96" rx="14" fill="#fff" stroke="#111" stroke-width="2.5"><animate attributeName="fill" dur="10s" repeatCount="indefinite" values="#fff;#fff;#ecfccb;#ecfccb;#fff" keyTimes="0;0.52;0.56;0.96;1"/></rect>
      <text x="720" y="104" font-size="26">🔁</text><text x="720" y="132" font-weight="700" fill="#111">Follow-ups</text><text x="720" y="150" fill="#5f6368" font-size="11.5">stop on reply</text>
    </g>
    <g>
      <rect x="822" y="70" width="116" height="96" rx="14" fill="#fff" stroke="#111" stroke-width="2.5"><animate attributeName="fill" dur="10s" repeatCount="indefinite" values="#fff;#fff;#a3e635;#a3e635;#fff" keyTimes="0;0.65;0.69;0.96;1"/></rect>
      <text x="880" y="104" font-size="26">🔥</text><text x="880" y="132" font-weight="700" fill="#111">Hot replies</text><text x="880" y="150" fill="#5f6368" font-size="11.5">sorted by AI</text>
    </g>
  </g>

  <!-- the prospect travelling -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.02;0.68;0.7;1"/>
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.7;1"><mpath href="#rail"/></animateMotion>
    <circle r="10" cy="-62" fill="#ff3d8b" stroke="#111" stroke-width="2"/>
    <circle r="4" cy="-62" fill="#fff"/>
  </g>

  <!-- after the email: LinkedIn + WhatsApp -->
  <g opacity="0.25">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0.25;0.25;1;1;0.25" keyTimes="0;0.72;0.76;0.96;1"/>
    <path d="M560,166 C560,200 520,212 470,222" fill="none" stroke="#111" stroke-width="2.5" stroke-dasharray="5 6"/>
    <path d="M560,166 C560,200 600,212 650,222" fill="none" stroke="#111" stroke-width="2.5" stroke-dasharray="5 6"/>
    <rect x="300" y="210" width="178" height="56" rx="12" fill="#fff" stroke="#111" stroke-width="2.5"/>
    <rect x="314" y="224" width="28" height="28" rx="6" fill="#0a66c2"/><text x="328" y="244" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial">in</text>
    <text x="352" y="236" font-size="13" font-weight="700" fill="#111">LinkedIn</text><text x="352" y="253" font-size="11.5" fill="#5f6368">invite → message</text>
    <rect x="642" y="210" width="178" height="56" rx="12" fill="#fff" stroke="#111" stroke-width="2.5"/>
    <circle cx="670" cy="238" r="14" fill="#25d366"/><text x="670" y="243" font-size="14" text-anchor="middle" fill="#fff">✆</text>
    <text x="694" y="236" font-size="13" font-weight="700" fill="#111">WhatsApp</text><text x="694" y="253" font-size="11.5" fill="#5f6368">message typed</text>
  </g>

  <text x="24" y="40" font-size="20" font-weight="800" fill="#111">What your agent runs with one sentence</text>
  <text x="24" y="304" font-size="12.5" fill="#5f6368">You approve before anything is sent · 1 credit per person contacted, follow-ups included</text>
</svg>
